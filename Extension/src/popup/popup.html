<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Course Backup</title>
   <link rel="icon" type="image/png" href="../../icon.png" />
   <link rel="stylesheet" href="popup.css" />
</head>
<body>

   <!-- ─── SIGN IN ──────────────────────────────────────────────────────── -->
   <div class="screen" data-screen="signin" hidden>
      <div class="screen-header">
         <div class="logo-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5"/><path d="M12 21v-8m0 0-3 3m3-3 3 3"/></svg>
         </div>
         <h1>Welcome back</h1>
         <p class="muted">Sign in to your Course Backup account.</p>
      </div>

      <form id="signin-form" class="form" novalidate>
         <div class="field">
            <label for="signin-email">Email</label>
            <input id="signin-email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required />
         </div>
         <div class="field">
            <label for="signin-password">Password</label>
            <input id="signin-password" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
         </div>

         <div class="alert" id="signin-alert" hidden></div>

         <button type="submit" class="btn primary" id="signin-btn">Sign in</button>
      </form>

      <div class="purchase-footer">
         <a id="purchase-link" href="#" target="_blank" rel="noopener noreferrer" hidden>
            Purchase access
         </a>
      </div>

      <div class="screen-footer">
         <button class="link-btn" data-go="forgot-password">Forgot password?</button>
      </div>
   </div>

   <!-- ─── FORGOT PASSWORD ──────────────────────────────────────────────── -->
   <div class="screen" data-screen="forgot-password" hidden>
      <div class="screen-header">
         <div class="logo-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
         </div>
         <h1>Reset password</h1>
         <p class="muted">Enter your email and we'll send you a reset link.</p>
      </div>

      <form id="forgot-form" class="form" novalidate>
         <div class="field">
            <label for="forgot-email">Email</label>
            <input id="forgot-email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required />
         </div>

         <div class="alert" id="forgot-alert" hidden></div>

         <button type="submit" class="btn primary" id="forgot-btn">Send reset link</button>
      </form>

      <div class="screen-footer">
         <button class="link-btn" data-go="signin">Back to sign in</button>
      </div>
   </div>

   <!-- ─── CHANGE PASSWORD ──────────────────────────────────────────────── -->
   <div class="screen" data-screen="change-password" hidden>
      <div class="screen-header">
         <div class="logo-mark accent-warn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
         </div>
         <h1>Set your password</h1>
         <p class="muted">This is a temporary password. Choose a permanent one to continue.</p>
      </div>

      <form id="change-password-form" class="form" novalidate>
         <div class="field">
            <label for="cp-current">Temporary password</label>
            <input id="cp-current" type="password" name="currentPassword" placeholder="••••••••" autocomplete="current-password" required />
         </div>
         <div class="field">
            <label for="cp-new">New password</label>
            <input id="cp-new" type="password" name="newPassword" placeholder="••••••••" autocomplete="new-password" required />
         </div>
         <div class="field">
            <label for="cp-confirm">Confirm new password</label>
            <input id="cp-confirm" type="password" name="confirmPassword" placeholder="••••••••" autocomplete="new-password" required />
         </div>

         <div class="alert" id="cp-alert" hidden></div>

         <button type="submit" class="btn primary" id="cp-btn">Set password &amp; continue</button>
      </form>
   </div>

   <!-- ─── HOME (signed-in) ─────────────────────────────────────────────── -->
   <div class="screen" data-screen="home" hidden>
      <div class="home-header">
         <div class="logo-mark small">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5"/><path d="M12 21v-8m0 0-3 3m3-3 3 3"/></svg>
         </div>
         <span class="home-title">Course Backup</span>
         <button class="icon-btn" id="sign-out-btn" title="Sign out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
         </button>
      </div>

      <div class="user-card">
         <div class="user-avatar" id="home-avatar"></div>
         <div class="user-info">
            <span class="user-email" id="home-email">—</span>
            <span class="user-label muted">Signed in</span>
         </div>
      </div>

      <div class="divider"></div>

      <!-- Connection usage — filled by populateHome -->
      <div class="conn-limit-section">
         <span class="conn-limit-label">Platform connections</span>
         <div class="conn-limit-bar">
            <div class="conn-limit-fill" id="home-conn-fill" style="width:0%"></div>
         </div>
         <span class="conn-limit-count" id="home-conn-count">—</span>
         <span class="conn-limit-detail muted" id="home-conn-detail">Loading…</span>
         <a id="home-upgrade-link" href="#" target="_blank" rel="noopener noreferrer" hidden>
            Purchase more
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
         </a>
      </div>

      <div class="alert" id="home-alert" hidden></div>
   </div>

   <!-- ─── LOADING (initial auth check) ────────────────────────────────── -->
   <div class="screen" data-screen="loading">
      <div class="loading-state">
         <div class="spin"></div>
      </div>
   </div>

   <script src="popup.js"></script>
</body>
</html>
